<!-- Intro Brief Cutscene Overlay (Brieven Stijl) -->
    <div id="cutscene-overlay" class="fixed inset-0 z-[100] bg-black hidden flex-col opacity-0 transition-opacity duration-700">
        <div id="cutscene-visual" class="vh-cutscene-bg absolute inset-0"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-black/60"></div>
       
        <div class="relative z-10 flex flex-col justify-center items-center h-full p-4 md:p-8 max-w-3xl mx-auto w-full">
            
            <!-- VERNIEUWDE LEESKAART: Realistische Oude Brief -->
            <div class="paper-card p-6 md:p-10 w-full shadow-2xl flex flex-col my-auto max-h-[85vh] relative">
                
                <!-- Decoratief stukje plakband/tape bovenaan -->
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-32 h-8 bg-amber-900/20 rotate-[-2deg] shadow-sm backdrop-blur-sm"></div>

                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b pb-3 mb-5 ink-header gap-2">
                    <div class="flex items-center gap-3">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <span id="cutscene-date" class="font-typewriter text-sm md:text-base font-bold"></span>
                    </div>
                    <span class="text-xs font-mono-military uppercase tracking-widest opacity-60 font-bold">Veldpost // Confidentieel</span>
                </div>
               
                <!-- Leesbaar tekstgedeelte -->
                <div class="paper-scroll overflow-y-auto flex-1 pr-4 mb-6 my-2">
                    <div id="cutscene-text" class="vh-letter font-typewriter typewriter-ink text-lg md:text-xl leading-relaxed"></div>
                </div>
               
                <!-- Geaccepteerd / Stempel Knop -->
                <button id="btn-skip-cutscene" class="stamp-btn self-end px-5 py-2 flex items-center gap-2">
                    Gelezen <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                </button>
            </div>
        </div>
    </div>
